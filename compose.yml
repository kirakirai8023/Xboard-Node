services:
  xboard-node:
    image: ghcr.io/kirakirai8023/xboard-node:latest
    container_name: xboard-node
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/etc/xboard-node
    command: ["-c", "/etc/xboard-node/config.yml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
